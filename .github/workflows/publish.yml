name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run preflight checks
        run: pnpm --filter scholar-mcp release:check

      - name: Verify version matches release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./packages/scholar-mcp/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag=$VERSION, package.json=$PKG_VERSION"
            exit 1
          fi
          echo "Version verified: $VERSION"

      - name: Publish to npm with provenance
        working-directory: packages/scholar-mcp
        run: npm publish --provenance --access public --registry https://registry.npmjs.org

      - name: Verify published npm version
        working-directory: packages/scholar-mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "scholar-mcp@$VERSION" version --registry https://registry.npmjs.org)
          test "$PUBLISHED" = "$VERSION"
          cd "$(mktemp -d)"
          INSTALLED=$(npm exec --yes --package="scholar-mcp@$VERSION" -- scholar-mcp --version)
          test "$INSTALLED" = "$VERSION"
