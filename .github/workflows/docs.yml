name: docs

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/scholar-mcp/src/**'
      - 'packages/scholar-mcp/package.json'
      - 'scripts/generate-docs-*.mjs'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/scholar-mcp/src/**'
      - 'packages/scholar-mcp/package.json'
      - 'scripts/generate-docs-*.mjs'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Test documentation generation
        run: node --test scripts/generate-docs-*.test.mjs

      - name: Test documentation search
        run: pnpm --filter scholar-mcp-docs test

      - name: Verify generated docs are committed
        run: |
          git diff --exit-code -- \
            apps/docs/src/content/docs/reference/mcp-tools.md \
            apps/docs/src/content/docs/releases/index.md
